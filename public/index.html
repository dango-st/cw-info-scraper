<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrowdWorks Users</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CrowdWorks Users</h1>
    <div id="stats" class="stats"></div>
  </header>

  <form id="filters" class="filters">
    <input type="search" name="q" placeholder="Search name, email, intro, category…" autocomplete="off">
    <select name="hasEmail">
      <option value="">Email: any</option>
      <option value="1">Has email</option>
      <option value="0">No email</option>
    </select>
    <select name="gender"><option value="">Gender: any</option></select>
    <select name="ageRange"><option value="">Age: any</option></select>
    <select name="prefecture"><option value="">Prefecture: any</option></select>
    <select name="occupations"><option value="">Occupation: any</option></select>
    <select name="searchKeywords"><option value="">Search keyword: any</option></select>
    <select name="sort">
      <option value="scrapedAt">Sort: last scraped</option>
      <option value="ratingAverage">Rating</option>
      <option value="contractCount">Contracts</option>
      <option value="viewCount">Profile views</option>
      <option value="lastAccessAt">Last access</option>
      <option value="minHourlyWage">Hourly wage</option>
      <option value="displayName">Name</option>
    </select>
    <select name="order">
      <option value="desc">↓ desc</option>
      <option value="asc">↑ asc</option>
    </select>
    <button type="button" id="reset">Reset</button>
    <a id="export" class="button" href="/api/export.csv">Export CSV</a>
  </form>

  <main>
    <div class="table-wrap">
      <table id="table">
        <thead>
          <tr>
            <th>ID</th><th>Name</th><th>Email</th><th>Gender / Age</th><th>Prefecture</th>
            <th>Occupation</th><th class="num">Rating</th><th class="num">Contracts</th>
            <th class="num">Views</th><th>Last access</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev" type="button">‹ Prev</button>
      <span id="pageInfo"></span>
      <button id="next" type="button">Next ›</button>
      <select id="limit">
        <option>25</option><option selected>50</option><option>100</option><option>200</option>
      </select>
    </div>
  </main>

  <aside id="detail" class="detail" hidden>
    <button id="close" class="close" type="button" aria-label="Close">×</button>
    <div id="detailBody"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
